<svg xmlns="http://www.w3.org/2000/svg" width="900" height="82" viewBox="0 0 900 82" role="img" aria-labelledby="title desc">
  <title id="title">Alireza Belal professional focus typing animation</title>
  <desc id="desc">Typing animation cycling through Technical Product Manager, B2B Platforms and Analytics, Data and AI Products, and Enterprise Product Delivery.</desc>

  <style>
    .main {
      font: 600 23px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #24292f;
    }
    .sub {
      font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #57606a;
      letter-spacing: .35px;
    }
    .cursor { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .main { fill: #f0f6fc; }
      .sub { fill: #8b949e; }
      .cursor { fill: #58a6ff; }
    }
  </style>

  <defs>
    <clipPath id="clip1"><rect x="270" y="4" width="0" height="34"><animate attributeName="width" values="0;360;360;0;0" keyTimes="0;0.11;0.19;0.24;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip2"><rect x="270" y="4" width="0" height="34"><animate attributeName="width" values="0;0;360;360;0;0" keyTimes="0;0.25;0.36;0.44;0.49;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip3"><rect x="270" y="4" width="0" height="34"><animate attributeName="width" values="0;0;360;360;0;0" keyTimes="0;0.50;0.61;0.69;0.74;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip4"><rect x="270" y="4" width="0" height="34"><animate attributeName="width" values="0;0;360;360;0;0" keyTimes="0;0.75;0.86;0.94;0.99;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g text-anchor="middle">
    <text class="main" x="450" y="29" clip-path="url(#clip1)">Technical Product Manager</text>
    <text class="main" x="450" y="29" clip-path="url(#clip2)">B2B Platforms &amp; Analytics</text>
    <text class="main" x="450" y="29" clip-path="url(#clip3)">Data &amp; AI Products</text>
    <text class="main" x="450" y="29" clip-path="url(#clip4)">Enterprise Product Delivery</text>
  </g>

  <g>
    <rect class="cursor" y="7" width="3" height="27" rx="1.5" opacity="0">
      <animate attributeName="x" values="270;625;625;270;270" keyTimes="0;0.11;0.19;0.24;1" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.19;0.23;0.24;1" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="1;0.15;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect class="cursor" y="7" width="3" height="27" rx="1.5" opacity="0">
      <animate attributeName="x" values="270;270;625;625;270;270" keyTimes="0;0.25;0.36;0.44;0.49;1" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;0;0" keyTimes="0;0.25;0.44;0.48;0.49;1" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="1;0.15;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect class="cursor" y="7" width="3" height="27" rx="1.5" opacity="0">
      <animate attributeName="x" values="270;270;625;625;270;270" keyTimes="0;0.50;0.61;0.69;0.74;1" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;0;0" keyTimes="0;0.50;0.69;0.73;0.74;1" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="1;0.15;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect class="cursor" y="7" width="3" height="27" rx="1.5" opacity="0">
      <animate attributeName="x" values="270;270;625;625;270;270" keyTimes="0;0.75;0.86;0.94;0.99;1" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;0;0" keyTimes="0;0.75;0.94;0.98;0.99;1" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="1;0.15;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text class="sub" x="450" y="65" text-anchor="middle">business problems  →  product decisions  →  analytics  →  technical execution</text>
</svg>