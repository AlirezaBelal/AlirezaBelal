<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio landscape: 17 documented projects</title>
  <desc id="desc">Animated horizontal bar chart grouping 17 documented projects into AI NLP and computer vision, automation and operations, data and analytics, and product prototypes.</desc>
  <style>
    .title { font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:#24292f; }
    .label { font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:#24292f; }
    .count { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:#0969da; }
    .muted { font: 400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:#57606a; }
    .track { fill:#d0d7de; }
    .bar { fill:#0969da; }
    .bar2 { fill:#2f81f7; }
    .bar3 { fill:#54aeff; }
    .bar4 { fill:#80ccff; }
    @media (prefers-color-scheme: dark) {
      .title,.label { fill:#f0f6fc; }
      .count { fill:#58a6ff; }
      .muted { fill:#8b949e; }
      .track { fill:#30363d; }
      .bar { fill:#58a6ff; }
      .bar2 { fill:#79c0ff; }
      .bar3 { fill:#a5d6ff; }
      .bar4 { fill:#cae8ff; }
    }
  </style>

  <text class="title" x="40" y="34">Portfolio landscape · 17 documented projects</text>
  <text class="muted" x="40" y="55">Broad, non-overlapping grouping of the canonical project inventory</text>

  <text class="label" x="40" y="92">AI / NLP / Computer Vision</text>
  <text class="count" x="840" y="92" text-anchor="end">7</text>
  <rect class="track" x="270" y="78" width="520" height="18" rx="9"/>
  <rect class="bar" x="270" y="78" width="0" height="18" rx="9">
    <animate attributeName="width" values="0;520;520;0" keyTimes="0;0.18;0.88;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text class="label" x="40" y="137">Automation &amp; Operations</text>
  <text class="count" x="840" y="137" text-anchor="end">5</text>
  <rect class="track" x="270" y="123" width="520" height="18" rx="9"/>
  <rect class="bar2" x="270" y="123" width="0" height="18" rx="9">
    <animate attributeName="width" values="0;371;371;0" keyTimes="0;0.24;0.88;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text class="label" x="40" y="182">Data &amp; Analytics</text>
  <text class="count" x="840" y="182" text-anchor="end">3</text>
  <rect class="track" x="270" y="168" width="520" height="18" rx="9"/>
  <rect class="bar3" x="270" y="168" width="0" height="18" rx="9">
    <animate attributeName="width" values="0;223;223;0" keyTimes="0;0.30;0.88;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text class="label" x="40" y="227">Product Prototypes</text>
  <text class="count" x="840" y="227" text-anchor="end">2</text>
  <rect class="track" x="270" y="213" width="520" height="18" rx="9"/>
  <rect class="bar4" x="270" y="213" width="0" height="18" rx="9">
    <animate attributeName="width" values="0;149;149;0" keyTimes="0;0.36;0.88;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text class="muted" x="40" y="258">17 projects across production systems, automation, data/AI, research and prototypes.</text>
</svg>